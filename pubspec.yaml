name: mobile_grobownik
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.1
  flutter: 3.44.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  auto_route: ^11.1.0
  freezed: ^3.2.5
  hooks_riverpod: ^3.3.2
  flutter_hooks: ^0.21.3+1
  riverpod_annotation: ^4.0.3
  flutter_svg: ^2.3.0
  dio: ^5.10.0
  google_fonts: ^8.1.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  freezed_annotation: ^3.1.0
  maplibre_gl: ^0.21.0
  geolocator: ^14.0.0
  fast_immutable_collections: ^11.2.0
  envied: ^1.3.8
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  solvro_config: ^1.9.0
  build_runner: ^2.15.0
  json_serializable: ^6.14.0
  riverpod_generator: ^4.0.4-dev.3
  auto_route_generator: ^10.6.0
  flutter_gen_runner: ^5.14.1
  envied_generator: ^1.3.8

# auto_route_generator (<=10.5.0) caps analyzer <11 and has no analyzer-12 build yet;
# the analyzer-12 lint/codegen stack needs analyzer 12, so force it here.
# Revisit once auto_route_generator ships analyzer-12 support.
dependency_overrides:
  analyzer: ^12.0.0
  # dart_style 3.1.9 requires analyzer ^13; pin to last analyzer-12-compatible release.
  dart_style: 3.1.8
  # mockito 5.7.0 requires analyzer ^13; pulled in transitively by riverpod_generator.
  mockito: 5.6.4

flutter_gen:
  output: lib/gen/ # Optional (default: lib/gen/)

  integrations:
    image: true
    flutter_svg: true

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/

  fonts:
    - family: KONSTRUKT-Regular
      fonts:
        - asset: assets/fonts/KONSTRUKT-Regular.otf
lint_staged:
  "lib/**.dart": dart format && dart fix --apply
